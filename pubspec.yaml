name: luts_c
description: "Lut's C — a desert liquid-glass reading sanctuary."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  path: ^1.9.1
  file_picker: ^13.1.0
  archive: ^4.5.2
  html: ^0.15.7
  xml: ^7.1.0
  http: ^1.6.0
  pdfrx: ^2.6.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path_provider_platform_interface: ^2.1.3

flutter:
  uses-material-design: true

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Variable.ttf
        - asset: assets/fonts/Cairo-Variable.ttf
          weight: 700
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    - family: ReemKufi
      fonts:
        - asset: assets/fonts/ReemKufi-Variable.ttf
        - asset: assets/fonts/ReemKufi-Variable.ttf
          weight: 700
